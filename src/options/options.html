<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NoMoreBing</title>
  <link rel="stylesheet" href="options.css">
  <script type="module" src="options.js"></script>
</head>
<body>
  <main>
    <h1 data-i18n="optionsTitle"></h1>
    <p data-i18n="optionsIntro"></p>

    <form id="form" novalidate>
      <fieldset id="engines"></fieldset>

      <div id="custom" hidden>
        <label>
          <span data-i18n="customSearchLabel"></span>
          <input id="custom-search" type="url" placeholder="https://example.com/search?q=%s" spellcheck="false">
        </label>
        <button type="submit" data-i18n="save"></button>
      </div>

      <p id="status" role="status"></p>
    </form>

    <p id="suggest-source"></p>
    <p class="note" data-i18n="suggestHowToOff"></p>

    <p class="note" data-i18n="howItWorks"></p>
  </main>
</body>
</html>
